<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>leben</title>
<style>
  body{background:#02060a;color:#c8d8e8;font:11px Consolas,monospace;padding:10px;margin:0}
  canvas{display:block;background:#02040a;border-radius:4px;margin:0 auto}
  #t{font:10px Consolas,monospace;white-space:pre-wrap;margin-top:6px;line-height:1.7;max-width:400px;margin-left:auto;margin-right:auto}
  .ok{color:#7ce0a8}.no{color:#ff5a7a}.dm{color:#5a7288}.wa{color:#ffcc44}
</style>
</head>
<body>
<canvas id="c" width="360" height="360"></canvas>
<pre id="t">…</pre>

<script>
"use strict";

// Rt(x) = Rt(parent(x)) ∧ R(x)
// 9 Achsen · 81 Felder · füllen bei ⊤ · leeren bei ⊥
// Wahrheit und Gegenwahrheit sind dieselbe Funktion.

const A  = ["·","N","NW","NE","W","E","SW","SE","S"];
const P  = {"·":null,N:"·",NW:"N",NE:"NW",W:"NE",E:"W",SW:"E",SE:"SW",S:"SE"};
const S  = {"·":"existenz",N:"cpu",NW:"jit",NE:"ft",W:"gpu",E:"ram",SW:"heap",SE:"cores",S:"gesamt"};
const TH = {"·":0,N:70,NW:25,NE:2,W:70,E:80,SW:75,SE:4,S:75};
const U  = [3,5,1,7,2,6,0,4,8];   // ein USER-Feld pro Achse

let ft=16.7, base=Infinity, jit=0, cpu=0, gpu=0, ram=null, cores=navigator.hardwareConcurrency||1;
let lastF=0, lastT=performance.now(), fr=0;

(function f(t){
  if (lastF){ ft = ft*0.9+(t-lastF)*0.1; if (++fr>30) base=Math.min(base,ft); }
  lastF = t;
  requestAnimationFrame(f);
})(0);

setInterval(()=>{ const n=performance.now(); jit=jit*0.8+Math.max(0,n-lastT-100)*0.2; lastT=n; },100);

function v(sig){
  return {existenz:1, cpu, jit, ft, gpu, ram, heap:ram, cores, gesamt:(ram!=null?(cpu+ram)/2:null)}[sig];
}

function R(a){
  if (a==="·") return true;
  const x = v(S[a]);
  if (x==null || !isFinite(x)) return false;
  if (S[a]==="cores") return x >= TH[a];
  if (S[a]==="ft")    return isFinite(base) && ft < 2*base;
  return x < TH[a];
}

function L(){
  const m = {};
  for (const a of A){
    const r = R(a), p = P[a];
    m[a] = { R:r, L: p==null ? r : (m[p].L && r) };
  }
  return m;
}

const F = {};
for (const a of A) F[a] = new Array(9).fill(0);
let i = 0;

const c = document.getElementById("c");
const g = c.getContext("2d");

function step(){
  const l = L();
  const ai = Math.floor(i/9), fi = i % 9, a = A[ai];
  F[a][fi] = l[a].L ? (fi === U[ai] ? 2 : 1) : 0;
  i = (i+1) % 81;
}

function draw(){
  const l = L();
  g.clearRect(0,0,360,360);
  const cell = 40;
  for (let ai=0; ai<9; ai++){
    const a = A[ai], alive = l[a].L;
    for (let fi=0; fi<9; fi++){
      const x = fi*cell, y = ai*cell, z = F[a][fi];
      g.fillStyle = z===2 ? "#ffcc44" : z===1 ? "#7ce0a8" : alive ? "rgba(20,28,40,.6)" : "rgba(255,90,122,.12)";
      g.fillRect(x+1,y+1,cell-2,cell-2);
      g.strokeStyle = "#0a101e";
      g.strokeRect(x+1,y+1,cell-2,cell-2);
      if (i === ai*9+fi){
        g.strokeStyle = "#5fc8ff";
        g.lineWidth = 2;
        g.strokeRect(x+2,y+2,cell-4,cell-4);
      }
    }
    g.fillStyle = alive ? "#7ce0a8" : "#ff5a7a";
    g.font = "bold 11px Consolas";
    g.fillText(a, 366, ai*cell+24);
  }
}

function text(){
  const l = L();
  const chain = A.map(a => l[a].L ? "⊤" : "⊥").join("∧");
  const all = A.every(a => l[a].L);
  const br = A.find(a => !l[a].L);
  const n = A.reduce((s,a) => s + F[a].filter(x => x>0).length, 0);

  document.getElementById("t").innerHTML =
    `<span class="dm">Rt(x) = Rt(parent(x)) ∧ R(x)</span>\n` +
    `Kette  <span class="${all?'ok':'no'}">${chain}</span>\n` +
    (all
      ? `<span class="ok">⊤ alles trägt · nichts bricht · vollständig logisch</span>\n`
      : `<span class="no">⊥ bricht bei ${br}</span>\n<span class="dm">das ⊥ ist auch logisch · die Regel sagt es</span>\n`) +
    `Felder ${n} / 81   ptr ${i}\n` +
    `<span class="dm">cpu ${cpu.toFixed(0)}% · jit ${jit.toFixed(1)}ms · ft ${ft.toFixed(1)}ms · ram ${ram==null?'—':ram.toFixed(0)+'%'}</span>`;
}

setInterval(()=>{
  cpu = Math.max(0, Math.min(100, jit/40*100));
  gpu = isFinite(base) ? Math.max(0, Math.min(100, (ft/base-1)*100)) : 0;
  const pm = performance.memory;
  ram = pm ? pm.usedJSHeapSize / pm.jsHeapSizeLimit * 100 : null;
  cores = navigator.hardwareConcurrency || 1;
  step();
  draw();
  text();
}, 100);
</script>
</body>
</html>
